<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Maintenance Hero: RCM Transformer – ชีวิตวิศวกรบำรุงรักษาหม้อแปลง</title>
<style>
:root{--bg:#0e151d;--panel:#16202b;--panel2:#1d2935;--line:#2a3948;--text:#e6edf3;--muted:#8fa1b3;--ok:#3fb950;--warn:#e3a92b;--bad:#f85149;--acc:#f0a63a;--blue:#58a6ff;--pink:#f778ba;--org:#f0883e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:14px;line-height:1.45;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--acc);background:#243241}
button:disabled{opacity:.4;cursor:not-allowed}
button.pri{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:600}
button.sel{border-color:var(--blue);background:#1b3352}
button.good{border-color:var(--ok);background:#173a24}button.badb{border-color:var(--bad);background:#3a1717}
h2,h3{margin:0}h2{font-size:18px}h3{font-size:14px;margin:14px 0 6px}
.muted{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.glass{background:#0e151dd9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:10px;pointer-events:none;z-index:4}
#hud>*{pointer-events:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.chip{padding:5px 9px;min-width:96px}
.sl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.sl b{color:var(--text);font-size:13px}
.sb{height:5px;background:#05090d;border-radius:9px;margin-top:4px;overflow:hidden}.sb i{display:block;height:100%;border-radius:9px;transition:width .4s}
.clockbox{padding:6px 14px;text-align:center;min-width:160px}
#timeLbl{font-size:24px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;line-height:1.1}
#dayLbl,#phaseLbl{font-size:12px;color:var(--muted)}
#rightCol{display:flex;flex-direction:column;align-items:flex-end;gap:6px;width:250px}
.hbtns{display:flex;gap:6px}.hbtns button{padding:7px 10px;background:#0e151dd9}
#mini{display:block;border-radius:10px;border:1px solid var(--line);background:#0e151dd9}
#tracker{padding:8px 10px;font-size:12.5px;width:100%}
#tracker h4{margin:0 0 4px;font-size:12.5px;color:var(--acc)}
.tk{padding:2px 0}.tk.done{color:var(--ok);text-decoration:line-through;opacity:.7}
#prompt{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);padding:10px 16px;font-size:15px;z-index:4;display:none;white-space:nowrap}
#prompt kbd{background:var(--acc);color:#1a1205;border-radius:6px;padding:1px 8px;font-weight:700;margin-right:6px}
#keys{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);padding:5px 12px;z-index:3;white-space:nowrap}
#minilog{position:fixed;left:10px;bottom:10px;width:340px;max-width:calc(100% - 20px);padding:8px 10px;font-size:12px;z-index:3}
.lg{padding:3px 0}.lg time{color:var(--muted);font-size:10.5px;margin-right:6px}
.lg.ok{color:#8be3a1}.lg.bad{color:#ff9a93}.lg.warn{color:#f5c955}.lg.info{color:#9cc8ff}
#toasts{position:fixed;top:84px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;pointer-events:none}
.toast{padding:8px 14px;font-size:14px;animation:tin .3s ease;max-width:90vw;text-align:center}
.toast.ok{border-color:#2f7a43}.toast.bad{border-color:#8a2d2a}.toast.warn{border-color:#7a5b16}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#16202bf7;border-left:1px solid var(--line);overflow:auto;padding:16px 16px 28px;z-index:8}
.pclose{position:sticky;top:0;float:right;padding:4px 10px;z-index:2}
.hidden{display:none!important}
#fade{position:fixed;inset:0;background:#05080b;opacity:0;pointer-events:none;transition:opacity .5s;z-index:15;display:flex;align-items:center;justify-content:center;font-size:22px;text-align:center;padding:20px}
#fade.on{opacity:1;pointer-events:auto}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:20px}
.mbox h2{margin-bottom:10px}.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:flex-end}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}th,td{border-bottom:1px solid var(--line);padding:5px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
td.hi{color:var(--bad);font-weight:700}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;white-space:nowrap;font-weight:600;display:inline-block}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fgrid button{text-align:left;font-size:12.5px}.fgrid small{display:block;color:var(--muted)}
.ac{display:block;width:100%;text-align:left;padding:12px;margin-bottom:8px}
.ac .an{font-weight:600}.ac .ae{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:#101b24;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.clue{background:#101b24;border-left:3px solid var(--blue);padding:8px 12px;border-radius:6px;margin:6px 0;font-size:13px}
.clue.k{border-left-color:var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.kpi{background:#101b24;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}.tabs button{padding:6px 10px;font-size:12.5px}
.app{border:1px solid #2b4560;border-radius:14px;overflow:hidden;margin-top:6px}
.apph{background:linear-gradient(90deg,#123a63,#1b5d8f);padding:10px 12px;display:flex;align-items:center;gap:10px}
.apph b{font-size:15px}.apph small{display:block;color:#bcd6ef;font-size:11px}
.appb{padding:10px 12px;background:#0f1922}
.matrix td{text-align:center;font-size:11.5px;height:44px;border:1px solid #0f1922}
.dlg{background:#101b24;border-radius:12px;padding:12px;margin:10px 0;font-size:14px;border-left:3px solid var(--acc)}
.fr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.fr .sb{flex:1;margin:0}
#joy{position:fixed;left:22px;bottom:22px;width:124px;height:124px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff2a;display:none;z-index:5;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:#ffffff50}
#useBtn{position:fixed;right:22px;bottom:30px;width:78px;height:78px;border-radius:50%;font-size:30px;display:none;z-index:5;background:#0e151dcc}
#runBtn{position:fixed;right:110px;bottom:40px;width:58px;height:58px;border-radius:50%;font-size:22px;display:none;z-index:5;background:#0e151dcc}
#runBtn.on{border-color:var(--acc);background:#3a2a10}
body.touch #joy,body.touch #useBtn,body.touch #runBtn{display:block}
body.touch #keys{display:none}
body.touch #minilog{display:none}
body.touch #prompt{bottom:160px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--bg);z-index:30;font-size:18px;text-align:center;padding:20px}
@media(max-width:760px){
  #panel{top:auto;height:74vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}
  .chip{min-width:74px;padding:4px 7px}.chips{max-width:calc(100vw - 180px)}
  #timeLbl{font-size:20px}.clockbox{min-width:110px;padding:5px 8px}
  #tracker{font-size:11.5px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}

.bdg{position:relative}.bdg i{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 5px;display:none}
#phone{position:fixed;right:16px;bottom:16px;width:340px;height:620px;max-height:calc(100vh - 32px);background:#0b0f14;border:3px solid #2a3340;border-radius:34px;box-shadow:0 20px 60px #000c;z-index:9;display:flex;flex-direction:column;overflow:hidden}
#phone .sbar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 6px;font-size:12px;color:#cfd8e3;background:#0b0f14}
.phx{padding:0 6px;margin-left:6px;font-size:13px;background:none;border:0;color:#fff}
#phone .scr{flex:1;overflow:auto;background:linear-gradient(160deg,#1b2a44,#3a1f4a)}
#phone .home{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px;padding:22px 14px}
.app-ic{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:#e6edf3;background:none!important;border:0!important;padding:0;position:relative}
.app-ic span{width:58px;height:58px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px #0006}
.app-ic i{position:absolute;top:-5px;right:10px;background:var(--bad);color:#fff;font-style:normal;font-size:10px;border-radius:99px;padding:1px 6px}
.phh{display:flex;align-items:center;gap:6px;padding:10px 12px;background:#1f8f55;color:#fff;font-weight:600;font-size:14px}
.phh button{background:none;border:0;color:#fff;font-size:22px;padding:0 8px 0 0;line-height:1}
.crow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid #222b36;border-radius:0;background:#121821;padding:10px 12px;position:relative}
.crow .av{font-size:24px;width:42px;height:42px;flex:none;border-radius:50%;background:#1d2935;display:flex;align-items:center;justify-content:center}
.crow small{display:block;color:#8fa1b3;font-size:11.5px}
.crow i{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#1f8f55;color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:1px 7px}
.chatv{background:#8aa4c8;min-height:100%;padding:10px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:80%;padding:7px 10px;border-radius:14px;font-size:13px;line-height:1.35;color:#111;background:#fff;white-space:pre-line;align-self:flex-start}
.bub.me{align-self:flex-end;background:#86e07a}.bub small{display:block;font-size:10px;color:#555;text-align:right}
.who{font-size:10.5px;color:#13203a;margin:2px 0 -4px 4px;font-weight:600}
.qr{display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:#121821;position:sticky;bottom:0}
.qr button{font-size:12.5px;padding:6px 12px;border-radius:99px;background:#1f8f55;border-color:#1f8f55;color:#fff}
.phbody{padding:12px;color:#e6edf3;background:#121821;min-height:100%}
.phnav{display:flex;justify-content:center;padding:9px;background:#0b0f14}
.phnav button{width:120px;height:6px;padding:0;border-radius:9px;background:#cfd8e3;border:0}
#speedo{position:fixed;left:50%;bottom:54px;transform:translateX(-50%);padding:8px 18px;text-align:center;z-index:4;font-size:12px}
#speedo b{font-size:30px;color:var(--acc);font-variant-numeric:tabular-nums}
.gauge{height:26px;border-radius:8px;position:relative;margin-top:10px;background:linear-gradient(90deg,#3b6fd6 0 40%,#e3a92b 40% 55%,#3fb950 55% 80%,#e3a92b 80% 90%,#f85149 90%)}
.gauge b{position:absolute;top:-5px;width:5px;height:36px;background:#fff;border-radius:3px;box-shadow:0 0 6px #000}
@media(max-width:760px){#phone{right:0;bottom:0;width:100%;height:82vh;border-radius:24px 24px 0 0}}
#emg{position:fixed;top:84px;left:50%;transform:translateX(-50%);padding:10px 16px;z-index:5;border-color:#a33;background:#3a0d0ddd;font-size:13px;min-width:300px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #f8514955}}
#emg~#toasts{top:200px}
body.hudmin #mini,body.hudmin #tracker,body.hudmin #minilog{display:none!important}
body.touch .chip .lbl{display:none}body.touch .chip{min-width:0;padding:3px 7px}body.touch .chips{gap:4px;max-width:44vw}body.touch .sl{gap:4px;font-size:11px}body.touch .sl b{font-size:12px}body.touch .sb{margin-top:2px}
body.touch .clockbox{min-width:0;padding:3px 8px;max-width:30vw}body.touch #timeLbl{font-size:18px}body.touch #dayLbl,body.touch #phaseLbl{font-size:10px;line-height:1.25}
body.touch #rightCol{width:auto;max-width:34vw}body.touch .hbtns{flex-wrap:wrap;justify-content:flex-end;gap:4px}body.touch .hbtns button{padding:4px 6px;font-size:13px}
body.touch #mini{width:150px;height:102px}body.touch #tracker{font-size:11px;max-height:28vh;overflow:auto;padding:6px 8px}body.touch #toasts{top:auto;bottom:150px}body.touch .toast{font-size:12.5px}
@media(max-width:760px){.chip .lbl{display:none}.chip{min-width:0;padding:4px 7px}.chips{gap:4px}.sl{gap:4px}.hbtns button{padding:6px 7px;font-size:13px}#mini{width:170px;height:116px}}
@media(max-height:500px){#hud{padding:6px}.chip{padding:3px 6px}#mini{width:160px;height:108px}#tracker{max-height:110px;overflow:auto}#prompt{bottom:100px}#joy{width:110px;height:110px;left:14px;bottom:14px}#useBtn{bottom:20px}#runBtn{bottom:28px}#panel{width:min(460px,60%);height:100%;top:0;border-radius:0}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="loading">⚡ กำลังสร้างนิคมอุตสาหกรรม...<span class="muted">Maintenance Hero: RCM Transformer</span></div>
<div id="hud">
  <div class="chips" id="stats"></div>
  <div class="glass clockbox"><div id="dayLbl"></div><div id="timeLbl"></div><div id="phaseLbl"></div></div>
  <div id="rightCol">
    <div class="hbtns"><button data-a="gfx" id="gfxBtn" title="คุณภาพกราฟิก">⚙️</button><button data-a="hudmin" title="ย่อ/ขยายแผนที่และรายการงาน">🗂️</button><button data-a="mute" id="muteBtn" title="เสียง">🔊</button><button data-a="tspeed" id="tsBtn" title="ความเร็วเวลา">🚶</button><button data-a="phone" class="bdg" title="โทรศัพท์ (P)">📱<i id="phbadge"></i></button><button data-a="status" title="สถานะ">📋</button><button data-a="help" title="คู่มือ">📘</button><button data-a="reset" title="เริ่มใหม่">↺</button></div>
    <canvas id="mini" width="250" height="170"></canvas>
    <div id="tracker" class="glass"></div>
  </div>
</div>
<div id="toasts"></div>
<div id="emg" class="glass" style="display:none"></div>
<div id="prompt" class="glass"></div>
<div id="keys" class="glass">WASD เดิน · Shift วิ่ง · ลากเมาส์หมุนกล้อง · ล้อเมาส์ซูม · E ใช้งาน/คุย · Esc ปิด</div>
<div id="minilog" class="glass"></div>
<div id="panel" class="hidden"><div id="pbody"></div></div>
<div id="phone" class="hidden"></div>
<div id="speedo" class="glass hidden"></div>
<div id="fade"><div id="fadeText"></div></div>
<div id="modal" class="modal hidden"><div class="mbox" id="mbox"></div></div>
<div id="joy"><div id="knob"></div></div>
<button id="runBtn">🏃</button>
<button id="useBtn">✋</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =====================================================================
   DATA
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const SAVE='rcm-hero-v1';
const HX=300;

const FMS={
 'FM-01':{comp:'ขดลวด',name:'ฉนวนกระดาษเสื่อมจากความร้อน',S:5,fix:'ลดโหลด + อบแห้งฉนวน (Dry-out)',time:180},
 'FM-02':{comp:'ขดลวด/จุดต่อ',name:'จุดร้อนเฉพาะที่ (Thermal fault)',S:4,fix:'ขันแน่น/ทำความสะอาดจุดต่อ',time:90},
 'FM-03':{comp:'ขดลวด',name:'Partial discharge / อาร์กภายใน',S:5,fix:'ตัดออกจากระบบ + ตรวจภายใน',time:240},
 'FM-04':{comp:'น้ำมันฉนวน',name:'น้ำมันเสื่อม / ความชื้นสูง',S:3,fix:'กรองน้ำมัน (Oil filtration)',time:180},
 'FM-05':{comp:'OLTC',name:'หน้าสัมผัสสึก/ไหม้',S:4,fix:'บำรุงรักษา OLTC เปลี่ยนหน้าสัมผัส',time:150},
 'FM-06':{comp:'OLTC',name:'ชุดขับมอเตอร์ขัดข้อง',S:2,fix:'ซ่อมชุดขับมอเตอร์ OLTC',time:60},
 'FM-07':{comp:'บุชชิ่ง',name:'ฉนวนภายในเสื่อม',S:5,fix:'เปลี่ยนบุชชิ่ง',time:240},
 'FM-08':{comp:'บุชชิ่ง',name:'น้ำมันรั่วที่ฐาน/ซีล',S:2,fix:'เปลี่ยนปะเก็น/ซีล',time:90},
 'FM-09':{comp:'ระบบระบายความร้อน',name:'พัดลม/ปั๊มน้ำมันไม่ทำงาน',S:3,fix:'เปลี่ยนมอเตอร์พัดลม/ปั๊ม',time:60},
 'FM-10':{comp:'ระบบระบายความร้อน',name:'รังผึ้งอุดตัน/รั่ว',S:2,fix:'ล้าง/ซ่อมรังผึ้ง',time:90}
};
const FM_W={'FM-01':.6,'FM-02':2,'FM-03':.7,'FM-04':1.5,'FM-05':1.2,'FM-06':1,'FM-07':.8,'FM-08':1.5,'FM-09':1.5,'FM-10':1};
const STRAT={PdM:{t:'PdM · Predictive',c:'#a371f7'},CBM:{t:'CBM · Condition-based',c:'#58a6ff'},PM:{t:'PM · Preventive',c:'#3fb950'},BM:{t:'BM · Breakdown',c:'#8b949e'}};
function stratFor(rpn){return rpn>=40?'PdM':rpn>=24?'CBM':rpn>=13?'PM':'BM';}

/* ---------- RCM calculations ---------- */
function effRate(T){return T.rate+(T.fault?T.fault.sev*8:0);}
function risk(hi,rate){const c=rate<=5?0:rate<=10?1:2;const M=[['L','L','L'],['L','L','M'],['M','M','H'],['H','H','VH'],['VH','VH','VH']];const r=hi>=85?0:hi>=70?1:hi>=50?2:hi>=30?3:4;return M[r][c];}
function tRisk(T){return T.trip?'VH':risk(T.hi,effRate(T));}
function grade(hi){return hi>=85?'VG':hi>=70?'G':hi>=50?'C':hi>=30?'P':'VP';}
function cond(hi){return hi>=70?'Healthy':hi>=50?'Warning':'Critical';}
function interval(T){return RISK[tRisk(T)].int;}
function overdue(T){return T.age-interval(T);}
function prioSorted(){return [...S.tx].sort((a,b)=>RORD[tRisk(a)]-RORD[tRisk(b)]||effRate(b)-effRate(a)||a.hi-b.hi);}
function unitR(T){if(T.trip||T.out)return 0;return Math.exp(-(0.003+Math.pow((100-T.hi)/100,2)*0.08+(T.fault?T.fault.sev*0.05:0)));}
function ssR(ss){const [a,b,c]=S.tx.filter(t=>t.ss===ss).map(unitR);return a*b*c+a*b*(1-c)+a*(1-b)*c+(1-a)*b*c;}
function sysR(){return ssR('LKB')*ssR('CLK');}
function topOil(T){if(T.trip)return 34;let t=38+T.load*0.38;if(T.fault){const f=T.fault;if(f.fm==='FM-09')t+=26*f.sev;if(f.fm==='FM-10')t+=16*f.sev;if(f.fm==='FM-02')t+=7*f.sev;if(f.fm==='FM-01')t+=4;}return Math.round(t);}
function fmeaCount(T){return Object.values(T.fm).filter(f=>f.ok).length;}
function stratCount(T){const c={PdM:0,CBM:0,PM:0,BM:0};Object.values(T.fm).forEach(f=>{if(f.ok&&f.pick)c[f.pick]++;});return c;}

/* ---------- DGA ---------- */
function dgaCat(T){
  const f=T.fault;if(!f)return 'N';
  switch(f.fm){case 'FM-01':return 'P';case 'FM-02':return f.sev<.6?'T12':'T3';case 'FM-03':return f.sev<.6?'PD':'D';case 'FM-04':return 'O';
    case 'FM-09':case 'FM-10':return f.sev>.5?'T12':'N';default:return 'N';}
}
function genDGA(T){
  const n=v=>Math.round(v*rnd(.9,1.1)*10)/10, s=T.fault?T.fault.sev:0, cat=dgaCat(T), age=(100-T.hi)/100;
  let g={H2:28,CH4:24,C2H6:18,C2H4:12,C2H2:0,CO:220+age*200,CO2:2100+age*1800,BDV:62,H2O:12,FAL:.2+age*.6};
  if(cat==='P'){g.CO=900+300*s;g.CO2=9000+3000*s;g.FAL=1.8+2*s;}
  if(cat==='T3'){g.C2H4=220+400*s;g.CH4=130+120*s;g.C2H6=45;g.C2H2=3+4*s;g.H2=80;}
  if(cat==='T12'){g.CH4=150+150*s;g.C2H4=60+40*s;g.C2H6=70+40*s;g.H2=60;}
  if(cat==='PD'){g.H2=520+800*s;g.CH4=50;}
  if(cat==='D'){g.C2H2=40+150*s;g.H2=320;g.C2H4=60;}
  if(cat==='O'){g.BDV=24+10*(1-s);g.H2O=30+20*s;}
  for(const k in g)g[k]=n(g[k]);if(cat!=='D')g.C2H2=Math.min(g.C2H2,9);g.C2H2=Math.max(0,Math.round(g.C2H2*10)/10);
  return {g,cat,t:T.id,day:S.day};
}

function advance(mins,stop){
  let d=0;
  for(let i=0;i<mins;i++){
    if(stop&&S.pending.length)return d;
    S.min++;d++;
    if(S.phase==='ot')S.money+=3;
    if(S.min>=1440){S.min-=1440;S.day++;S.tx.forEach(t=>t.age++);}
    if(S.min%60===0)hourTick();
    if(S.lab.length&&S.lab[0].ready<=absMin())labReady();
    if(S.delivery&&S.delivery.length&&S.delivery[0].ready<=absMin())deliver();
  }
  return d;
}
function hourTick(){
  const work=(S.phase==='work'||S.phase==='ot')&&S.loc==='estate';
  const h=S.min/60,night=h<6||h>=22;
  S.tx.forEach(T=>{
    const sib=S.tx.filter(x=>x.ss===T.ss&&x!==T&&(x.trip||x.out)).length;
    T.load=Math.round(T.base*(h>=8&&h<20?1.12:.82)*(1+sib*.3)*(T.loadRed===S.day?.75:1)*(S.loadUp&&S.loadUp.day===S.day&&S.loadUp.ss===T.ss?1.2:1)*(S.wx==='hot'?1.1:1));
    if(T.out){T.load=0;return;}
    if(T.trip){if(work){S.rep-=2;S.mood-=1;}return;}
    T.hi=clamp(T.hi-T.rate*12/365/24-(T.fault?T.fault.sev*.18:0),0,100);
    if(T.fault){
      T.fault.sev+=T.fault.rate*(night?.5:1)*(T.load>85?1.4:1)*(T.loadRed===S.day?.6:1);
      if(T.fault.sev>=1)tripTx(T,work);
    } else if(Math.random()<0.004*(1+(100-T.hi)/50)*(night?.5:1)){
      const keys=Object.keys(FM_W).filter(k=>k!=='FM-01'||T.hi<60);let tot=keys.reduce((a,k)=>a+FM_W[k],0),r=Math.random()*tot,fm=keys[0];
      for(const k of keys){r-=FM_W[k];if(r<=0){fm=k;break;}}
      T.fault={fm,sev:.08,rate:rnd(.012,.024)};T.find=[];T.known=null;
    }
  });
  if(work)S.mood-=0.5;
  if(S.phase!=='sleep'){S.clean-=work?4:2.5;if(S.clean<20)S.mood-=1;}else S.clean-=1;
  norm();
}

function genTasks(){
  const t=[];
  const od=S.tx.filter(x=>overdue(x)>0&&!x.trip).sort((a,b)=>RORD[tRisk(a)]-RORD[tRisk(b)]||overdue(b)-overdue(a));
  if(od[0])t.push({type:'sample',t:od[0].id});
  const kn=S.tx.find(x=>x.known&&x.fault)||S.tx.find(x=>x.trip);
  if(kn)t.push({type:'fix',t:kn.id});
  const nf=S.tx.find(x=>fmeaCount(x)<10);
  if(nf&&t.length<3)t.push({type:'fmea',t:nf.id});
  const pool=[{type:'ir',ss:pick(['LKB','CLK'])},{type:'risk'}];
  if(S.labRes&&S.labRes.length)pool.unshift({type:'dga'});
  if(od[1])pool.push({type:'sample',t:od[1].id});
  while(t.length<3&&pool.length){const p=pool.splice(Math.floor(Math.random()*Math.min(2,pool.length)),1)[0];if(!t.some(x=>x.type===p.type&&x.t===p.t))t.push(p);}
  t.push({type:'report'});
  return t.map(x=>({...x,done:false}));
}
function taskText(k){
  switch(k.type){
    case 'sample':return `🧪 เก็บตัวอย่างน้ำมัน ${k.t} ส่งแล็บ`;
    case 'fix':return `🔧 แก้ไขปัญหา ${k.t}`;
    case 'fmea':return `📊 ทำ FMEA & RCM ของ ${k.t} ให้ครบ 10/10`;
    case 'ir':return `📷 สแกน IR หม้อแปลงทั้ง 3 ลูกที่สถานี ${k.ss}`;
    case 'risk':return `🎯 ทบทวนความเสี่ยง (Risk & priority)`;
    case 'dga':return `🧪 วิเคราะห์ผล DGA ที่รออยู่ให้หมด`;
    case 'report':return `📄 ส่งรายงานประจำวันให้บอสก่อนเลิกงาน`;
    case 'cover':return `🙏 ช่วยงานแทนเบียร์: ตรวจพินิจ ${k.t}`;
  }
}
function markTask(type,key){
  let any=false;
  S.tasks.forEach(k=>{if(k.done||k.type!==type)return;if((k.t||k.ss)&&key!==(k.t||k.ss))return;k.done=true;any=true;audio('chime');S.rep+=3;S.xp+=10;toast(`✅ งานสำเร็จ: ${taskText(k)} (+10 XP)`,'ok');log(`✅ งานสำเร็จ: ${taskText(k)}`,'');});
  return any;
}
function checkIRTask(){S.tasks.forEach(k=>{if(k.type==='ir'&&!k.done&&S.tx.filter(t=>t.ss===k.ss).every(t=>t.irDay===S.day))markTask('ir',k.ss);});}
function checkDgaTask(){if(!S.labRes.length)markTask('dga');}
function endShift(){
  if(S.shiftEnded===S.day)return;S.shiftEnded=S.day;S.q.tasksAll=(S.q.tasksAll||0)+S.tasks.length;S.q.tasksDone=(S.q.tasksDone||0)+S.tasks.filter(k=>k.done).length;

  else{S.rep+=3;S.mood+=4;log('🌟 ทำงานครบทุกรายการวันนี้! บอสชมเชย','ok');}
}

function fmeaSubmit(){
  const F=S.fm,T=TX(F.t);if(!F)return;
  if(F.list.some(k=>!F.picks[k])){toast('เลือกกลยุทธ์ให้ครบทุก failure mode ก่อน','warn');return;}
  advance(30);let ok=0;
  F.list.forEach(k=>{const f=T.fm[k],rp=FMS[k].S*f.O*f.D;if(F.picks[k]===stratFor(rp)){f.ok=true;f.pick=F.picks[k];ok++;}});
  S.xp+=ok*2;const bad=F.list.length-ok;if(bad){S.rep-=1;}
  log(`📊 FMEA ${T.id}: ยืนยันถูกต้อง ${ok}/${F.list.length} รายการ${bad?' (ที่ผิดต้องทำใหม่)':''}`,bad?'warn':'ok');
  S.fm=null;
  if(fmeaCount(T)===10){S.xp+=8;markTask('fmea',T.id);log(`📊 FMEA & RCM ของ ${T.id} ครบ 10/10 แล้ว`,'ok');}
}
function makeRiskQuiz(){
  if(Math.random()<.5){const T=pick(S.tx);return {kind:'level',t:T.id,hi:+T.hi.toFixed(1),rate:+effRate(T).toFixed(2),ans:risk(T.hi,effRate(T))};}
  const opts=[...S.tx].sort(()=>Math.random()-.5).slice(0,3);const best=[...opts].sort((a,b)=>RORD[tRisk(a)]-RORD[tRisk(b)]||effRate(b)-effRate(a)||a.hi-b.hi)[0];
  return {kind:'prio',opts:opts.map(o=>o.id),ans:best.id};
}
function answerRisk(a){
  const q=S.quiz;if(!q)return;advance(10);
  if(a===q.ans){S.xp+=6;log('🎯 ตอบคำถาม Risk & priority ถูกต้อง','ok');markTask('risk');S.quiz=null;}
  else{S.rep-=1;log('❌ ยังไม่ถูก ลองดู Risk matrix อีกครั้ง','bad');S.quiz=makeRiskQuiz();}
}

function sleep(){closePanel();S.phase='sleep';S.sleepMins=0;log('😴 เข้านอน','');fade(true,'😴 หลับฝันดี...');setTimeout(continueSleep,700);}
function continueSleep(){
  const mins=S.min>=420?1440-S.min+420:420-S.min;
  S.sleepMins+=advance(mins,true);
  if(S.pending.length){processPending();return;}
  wake();
}

  const hrs=S.sleepMins/60;S.energy+=hrs*11+(S.fit?10:0)+(S.outfit==='pajama'?6:0)+(S.own&&S.own.bed?8:0);S.fit=false;if(S.outfit==='pajama')log('🛌 นอนในชุดนอน หลับสบาย (+6 พลังงาน)','');

    enqueue({title:'📞 ศูนย์ควบคุมโทรมา!',html:`<p>ตอนนี้ ${fmt(S.min)} — <b>${T.id}</b> (${SSD[T.ss].th}) ทริป! โรงงานในนิคมฯ ไฟดับบางส่วน</p><p class="muted">ถ้าไปเองจะเหนื่อยและเสียเวลาพักผ่อน ถ้าไม่ไป ชื่อเสียงลดและหม้อแปลงจะหยุดจนกว่าคุณจะซ่อม</p>`,
      choices:[{label:'🚗 รีบไปสถานีไฟฟ้า',cls:'pri',fn:()=>callGo(T)},{label:'😓 ให้กะดึกจัดการเบื้องต้น',fn:()=>{S.rep-=6;S.mood-=3;log(`ไม่ได้ไปดู ${T.id} ตอนกลางคืน`,'bad');}}],

function callGo(T){

  else{T.trip=false;T.fault.sev=.6;S.rep+=2;S.xp+=4;log(`🌙 จ่ายไฟ ${T.id} คืนได้ชั่วคราว แต่ยังต้องหาสาเหตุจริง`,'warn');}

const EVENTS=[

];
function checkTime(){
  if(modalOpen||W.traveling||S.over)return;
  checkMsgs();onMinute();
  const p=S.phase,wd=S.day%7;
  if(S.loc==='estate'&&(p==='work')){
    if(S.min>=720&&S.lunchFlag!==S.day){S.lunchFlag=S.day;log('🍱 พักเที่ยงแล้ว! ไปกินข้าวที่โรงอาหารกับเพื่อนๆ (12:00–13:00)','warn');}
    if(S.min>=810&&S.ateLunch!==S.day&&S.lunchFlag===S.day){S.lunchFlag=-S.day;S.energy-=12;S.mood-=5;log('😫 ไม่ได้กินข้าวเที่ยง หิวมาก (พลังงาน -12)','bad');}
    if(wd===3&&S.min>=885&&S.trainFlag!==S.day){S.trainFlag=S.day;log('🎓 15:00 อบรม DGA ที่ห้องประชุมในออฟฟิศ — เดินไปที่โต๊ะประชุมได้เลย','warn');}
  }
  if(p==='work'&&S.min>=1020&&S.shiftAsked!==S.day){
    S.shiftAsked=S.day;closePanel();
    const left=S.tasks.filter(k=>!k.done).length;
    const ch=[{label:'🏭 ทำ OT ต่อถึง 21:00 (180฿/ชม.)',fn:()=>{S.phase='ot';log('🏭 เริ่มทำ OT ถึง 21:00','info');}},{label:'🏠 กลับบ้าน',cls:'pri',fn:()=>goHome()}];
    if(wd===5)ch.unshift({label:'🍖 ไปปาร์ตี้หมูกระทะกับทีม (-250฿)',fn:()=>teamParty()});
    const fe=festToday(S.day);if(fe&&fe.id==='loy')ch.unshift({label:'🏮 ไปลอยกระทง'+(partnerId()?` กับ${NPC(partnerId()).name}`:' กับเพื่อนๆ'),cls:'pri',fn:()=>festLoy()});if(fe&&fe.id==='party')ch.unshift({label:'🎉 ไปงานเลี้ยงปีใหม่บริษัท',cls:'pri',fn:()=>festParty()});
    enqueue({title:'🔔 17:00 เลิกงานแล้ว',html:`<p>${left?`ยังมีงานค้าง <b>${left}</b> รายการ — ทำ OT ต่อเพื่อเคลียร์งานได้`:'วันนี้ทำงานครบทุกรายการแล้ว เยี่ยม!'}</p>${wd===5?'<p>วันศุกร์นี้ทีมนัดปาร์ตี้หมูกระทะปิดสัปดาห์!</p>':''}`,choices:ch});
  } else if(p==='ot'&&S.min>=1260){
    closePanel();S.phase='work';S.shiftAsked=S.day;
    enqueue({title:'🌙 21:00 จบ OT',html:'<p>ได้เวลากลับบ้านพักผ่อนแล้ว</p>',choices:[{label:'กลับบ้าน',cls:'pri',fn:()=>goHome()}]});
  } else if((p==='evening'||p==='holiday')&&(S.min>=1410||S.min<360)){
    S.mood-=3;log('🥱 ดึกมากแล้ว เผลอหลับไป','warn');sleep();
  } else if(p==='morning'&&S.min>=600){
    S.rep-=10;S.mood-=5;closePanel();
    enqueue({title:'📞 คุณวิชัยโทรตาม!',html:'<p>10 โมงแล้ว ทำไมยังไม่มาทำงาน!?</p>',choices:[{label:'รีบไปเดี๋ยวนี้',cls:'pri',fn:()=>goWork(true)}]});
  }
}
function checkEnd(){
  if(S.over)return;
  if(S.mood<=0){S.over=true;enqueue({title:'😵 หมดไฟ (Burnout)',html:`<p>ความสุขหมดลง คุณขอลาพักยาว... อยู่ได้ ${S.day} วัน</p><p class="muted">งานสำคัญ แต่ชีวิตก็สำคัญ — พักเที่ยง คุยกับเพื่อน และพักผ่อนให้พอ</p>`,choices:[{label:'เริ่มใหม่',cls:'pri',fn:()=>restart()}]});}
  else if(S.rep<=0){S.over=true;enqueue({title:'📄 ถูกเลิกจ้าง',html:`<p>หม้อแปลงทริปบ่อยและงานค้างเยอะ ฝ่ายบริหารหมดความเชื่อมั่น... อยู่ได้ ${S.day} วัน</p><p class="muted">ใช้ Risk matrix จัดลำดับ แล้วจัดการหม้อแปลงที่เสี่ยงสูงก่อน</p>`,choices:[{label:'เริ่มใหม่',cls:'pri',fn:()=>restart()}]});}
}
function promoHint(){const n=LEVELS[S.level+1];if(n&&S.xp>=n.xp&&S.rep>=n.rep&&S._promoHint!==S.day){S._promoHint=S.day;toast(`🎉 คุณมีคุณสมบัติขอเลื่อนเป็น ${n.name} แล้ว — ไปคุยกับคุณวิชัย`,'ok');}}
function after(){norm();checkEnd();achCheck();if(S.pending.length&&S.phase!=='sleep')processPending();promoHint();save();hud();refreshPanel();checkTime();}

  $('#mbox').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ch[+b.dataset.m].fn();if(it.after)it.after();norm();hud();showNext();});

function wall(xa,za,xb,zb,h,mat,gaps=[],t=.25,parent=EG){

function collide(p,r=.35,noCar){
  for(const c of colliders){if(p.x>c.x0-r&&p.x<c.x1+r&&p.z>c.z0-r&&p.z<c.z1+r){const dl=p.x-(c.x0-r),dr=(c.x1+r)-p.x,dt=p.z-(c.z0-r),db=(c.z1+r)-p.z,m=Math.min(dl,dr,dt,db);if(m===dl)p.x=c.x0-r;else if(m===dr)p.x=c.x1+r;else if(m===dt)p.z=c.z0-r;else p.z=c.z1+r;}}
  if(!noCar&&S.car&&S.car.loc===S.loc&&!W.driving){const fx=Math.sin(S.car.ry),fz=Math.cos(S.car.ry);for(const o of [1.3,0,-1.3]){const qx=S.car.x+fx*o,qz=S.car.z+fz*o,dx=p.x-qx,dz=p.z-qz,d=Math.hypot(dx,dz),mn=r+1;if(d<mn&&d>1e-4){p.x=qx+dx/d*mn;p.z=qz+dz/d*mn;}}}
}

function frame(now){

  ray.set(tgt,off);ray.far=dist+.5;occluders.forEach(o=>o.visible=true);ray.intersectObjects(occluders.filter(o=>o.parent.visible),false).forEach(h=>h.object.visible=false);

function updateNPCs(dt,t){
  const show=S.loc==='estate'&&!isHoliday(S.day)&&S.phase!=='morning';
  const now=absMin(),jump=Math.abs(now-W.lastNpcMin)>12;W.lastNpcMin=now;

  const workHrs=(S.phase==='work')&&S.min>=480&&S.min<1020&&!(S.min>=720&&S.min<780);

    if(!show||!activeNPC(n.d.id)){n.p.g.visible=false;n.vis=false;n.bub.visible=false;return;}

    if(n.path.length){const [tx,tz]=n.path[0];const dx=tx-n.x,dz=tz-n.z,d=Math.hypot(dx,dz);
      if(d<.15)n.path.shift();else{const sp=Math.min(d,2.3*dt);n.x+=dx/d*sp;n.z+=dz/d*sp;moving=true;let a=Math.atan2(dx,dz)-n.ry;a=Math.atan2(Math.sin(a),Math.cos(a));n.ry+=a*Math.min(1,dt*10);}}
    if(n.job&&G.k.startsWith('job')&&!n.path.length&&!n.atJob){n.atJob=true;n.jobEnd=now+n.job.dur;}
    const near=Math.hypot(W.pl.x-n.x,W.pl.z-n.z)<3.2;

    if(face!==null){let a=face-n.ry;a=Math.atan2(Math.sin(a),Math.cos(a));n.ry+=a*Math.min(1,dt*4);}
    const gone=G.k==='gone'&&!n.path.length;
    n.vis=!gone;n.p.g.visible=!gone;n.p.g.position.set(n.x,0,n.z);n.p.g.rotation.y=n.ry;
    let mode=false;if(!moving&&!near){if(n.atJob&&n.job)mode=n.job.anim;else if(G.k==='work'&&n.d.id!=='james')mode='type';}

  });
}

  if(/ดื่ม|กาแฟ|ชา/.test(text))return `ส่วนใหญ่ดื่ม${P.drink}นะ`;
  if(/ว่าง|งานอดิเรก|วันหยุด|ชอบทำ/.test(text))return `ว่างๆ ก็${P.hobby} แกล่ะชอบทำอะไร?`;
  if(/บ้าน.*(ไหน|อยู่)|มาจาก/.test(text))return `บ้านเกิดอยู่${P.home} แกล่ะ?`;
  if(/เป็นไง|สบายดี|เป็นยังไง/.test(text))return pick(['สบายดี งานเยอะนิดหน่อย แกล่ะ?','ก็เรื่อยๆ วันนี้ไม่เลวนะ']);
  if(/ทำอะไร|ทำไร|อยู่ไหน/.test(text)){const np=W.npcs.find(n=>n.d.id===id);return np?`ตอนนี้กำลัง${npcActivity(np).replace(/^\S+\s/,'')} อยู่`:'อยู่บ้านจ้า';}

  if(/อากาศ|ฝน|ร้อน|พายุ/.test(text))return `วันนี้${WX[S.wx].n} ${SEASON_TH[season(S.day)]}`;
  if(/กินข้าว|กินยัง|หิว/.test(text))return S.min>=780?'กินแล้ว อิ่มมาก แกกินยัง?':'ยังเลย รอเที่ยงอยู่ 😋';

  return null;
}

    return love>=50?{reply:pick(['พูดแบบนี้เขินนะ… แต่ชอบ 💕','ฉัน… ก็รู้สึกเหมือนกันแหละ 😳','อย่าเพิ่งพูดตรงนี้สิ คนมอง 🙈']),fr:1,love:3}:love>=20?{reply:pick(['แซวอีกแล้ว 🙈','บ้า! พูดอะไรของแก 😆']),fr:1,love:2}:{reply:pick(['ห๊ะ? 😅 พูดเล่นใช่มะ','อ่า… ทำงานต่อเถอะ 555']),fr:0,love:1};}
  // answer to our own pending question
  if(st.q&&(AGREE.test(text)||DENY.test(text))){const yes=AGREE.test(text)&&!DENY.test(text);S.ctopic[id]={t:st.t,kw:st.kw};

  let topic=null,kw='';for(const [k,T] of Object.entries(FB)){const m=text.match(T.kw);if(m){topic=k;kw=m[0];break;}}

function history(id){
  const a=(S.conv[id]||[]).filter(c=>c.t!=='…').map(c=>({w:c.w,t:c.t,m:c.m||0,ch:'ต่อหน้า'}));

      st.phase='run';refreshPanel();mgGauge(p=>{mgNext((1-st.mis*.3)*.5+gq(p)*.5);});MG.st.g.lbl=p=>{const kv=Math.round(22+p*.62);return `BDV ${kv} kV · ${p<55?'ยังกรองไม่พอ':p<80?'ผ่านเกณฑ์แล้ว หยุดได้ 👌':'เปลืองเวลาเกินไป'}`;};return;}refreshPanel();return;}}

      ${st.next===0?`<text x="${cx}" y="${cy-r-26}" text-anchor="middle" fill="#f0a63a" font-size="12">▼ เริ่มตรงนี้</text>`:''}</svg>`;}

let CR=null;
function startCrane(stage){
  const install=stage===3;CR={install,crash:0,hx:install?70:350,hy:install?30:0,vx:0,th:0,om:0,L:55,done:false,msg:''};
  openPanel(cranePanel);setTimeout(()=>{document.querySelectorAll('.crb').forEach(b=>{const k=b.dataset.k;const on=e=>{e.preventDefault();keys[k]=true;},off=()=>{keys[k]=false;};b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);});},30);
  let last=performance.now();const loop=now=>{if(!CR||CR.done)return;const dt=Math.min(.04,(now-last)/1000);last=now;craneStep(dt);if(!CR||CR.done)return;craneDraw();requestAnimationFrame(loop);};requestAnimationFrame(loop);
}
function cranePanel(){return `<h2>🏗️ บังคับเครน: ${CR.install?'ยกหม้อแปลงใหม่ลงฐาน':'ยกหม้อแปลงเก่าไปวางบนรถบรรทุก'}</h2><p class="muted">⬅️➡️ เลื่อนรอก · ⬆️⬇️ ยก/หย่อน (ปุ่มลูกศรบนคีย์บอร์ด หรือกดค้างปุ่มด้านล่าง) — ของจะแกว่งตามแรงเร่ง รอให้นิ่งก่อนวาง · ห้ามชนบุชชิ่งหม้อแปลงลูกข้าง · ห้ามยกสูงจนเฉียดสายไฟแรงสูง</p>
  <canvas id="crcv" width="480" height="270" style="width:100%;background:#0b1218;border-radius:10px;display:block"></canvas><div id="crmsg" style="text-align:center;margin:6px 0;font-weight:600"></div>
  <div class="btns" style="justify-content:center">${[['ArrowLeft','⬅️'],['ArrowUp','⬆️'],['ArrowDown','⬇️'],['ArrowRight','➡️']].map(([k,l])=>`<button class="crb" data-k="${k}" style="font-size:22px;width:64px;touch-action:none">${l}</button>`).join('')}</div>`;}
function craneStep(dt){
  const c=CR,left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,up=keys.ArrowUp||keys.KeyW,down=keys.ArrowDown||keys.KeyS;
  const tv=((right?1:0)-(left?1:0))*85,ax=(tv-c.vx)/Math.max(dt,1e-3)*.25;c.vx+=(tv-c.vx)*Math.min(1,dt*4);c.hx=clamp(c.hx+c.vx*dt,40,440);
  const g=300;c.om+=(-(g/c.L)*Math.sin(c.th)-(ax/c.L)*Math.cos(c.th)*.5-1.1*c.om)*dt;c.th+=c.om*dt;c.th=clamp(c.th,-.9,.9);
  c.hy=clamp(c.hy+((up?1:0)-(down?1:0))*55*dt,0,200);
  const cx=c.hx+c.L*Math.sin(c.th),floor=cx>20&&cx<120?30:0;if(c.hy<floor)c.hy=floor;
  const box=[cx-34,cx+34,c.hy,c.hy+48],hit=(r)=>box[0]<r[1]&&box[1]>r[0]&&box[2]<r[3]&&box[3]>r[2];
  const obs=[[205,232,0,128],[cx>20&&cx<120?0:0,0,0,0]];
  let crash='';if(hit(obs[0]))crash='💥 ชนบุชชิ่งหม้อแปลงลูกข้าง!';if(box[3]>238)crash='⚡ เฉียดสายไฟแรงสูง! อันตราย!';
  const tx=c.install?350:70,ty=c.install?0:30;
  if(!crash&&c.hy<=floor+.01&&(down||c.hy===floor)&&c.landed!==true){const okX=Math.abs(cx-tx)<14,okT=Math.abs(c.th)<.1;
    if(floor===ty&&okX&&okT&&Math.abs(c.hx-(c.install?70:350))>60){c.done=true;craneEnd();return;}
    if(floor===ty&&(!okX||!okT)&&down&&Math.abs(c.hx-(c.install?70:350))>60)crash=okX?'💥 วางตอนของยังแกว่ง กระแทกฐาน!':'💥 วางไม่ตรงฐาน!';}
  if(crash){c.crash++;audio('buzz');c.msg=crash;Object.assign(c,{hx:c.install?70:350,hy:c.install?30:0,vx:0,th:0,om:0});S.budget=Math.max(0,S.budget-.05);}
  const m=document.getElementById('crmsg');if(m)m.textContent=(c.msg?c.msg+' · ':'')+`ชน ${c.crash} ครั้ง · แกว่ง ${Math.abs(c.th*57).toFixed(0)}°`;
}
function craneDraw(){
  const cv=document.getElementById('crcv');if(!cv)return;const g=cv.getContext('2d'),c=CR,H=270,Y=y=>H-20-y;
  g.clearRect(0,0,480,H);g.fillStyle='#2b3b2a';g.fillRect(0,Y(0),480,20);
  g.strokeStyle='#ffdd55';g.setLineDash([6,6]);g.beginPath();g.moveTo(0,Y(240));g.lineTo(480,Y(240));g.stroke();g.setLineDash([]);g.fillStyle='#ffdd55';g.font='11px sans-serif';g.fillText('สายไฟแรงสูง ⚡',8,Y(244));
  g.fillStyle='#1b5d8f';g.fillRect(20,Y(30),100,30);g.fillStyle='#2c3e50';g.fillRect(100,Y(60),30,30);g.fillStyle='#ddd';g.fillText('รถบรรทุก',36,Y(10));
  g.fillStyle='#9a9da0';g.fillRect(300,Y(6),100,6);g.strokeStyle='#3fb950';g.lineWidth=2;g.strokeRect(336-2,Y(10),32,8);g.fillStyle='#3fb950';g.fillText('ฐาน',338,Y(-8)+0);
  g.fillStyle='#7f8a91';g.fillRect(170,Y(70),80,70);g.fillStyle='#6e4026';for(let i=0;i<3;i++)g.fillRect(205+i*9-9,Y(128),6,58);g.fillStyle='#ccc';g.fillText('หม้อแปลงลูกข้าง',172,Y(-8)+0);
  g.fillStyle='#f2b800';g.fillRect(0,Y(262),480,6);g.fillRect(c.hx-14,Y(262),28,12);
  const cx=c.hx+c.L*Math.sin(c.th),ly=c.hy+48;g.strokeStyle='#ddd';g.lineWidth=1.5;g.beginPath();g.moveTo(c.hx,Y(250));g.lineTo(cx,Y(ly+4));g.stroke();
  g.save();g.translate(cx,Y(c.hy+24));g.rotate(c.th*.3);g.fillStyle=c.install?'#9aa7ad':'#6f777c';g.fillRect(-34,-24,68,48);g.fillStyle='#6e4026';for(let i=0;i<3;i++)g.fillRect(-14+i*12,-34,5,10);g.restore();
  g.fillStyle='#f0a63a';g.font='12px sans-serif';g.fillText(c.install?'🎯 วางลงฐานสีเขียว':'🎯 วางลงบนรถบรรทุก',330,18);
}
function craneEnd(){
  const c=CR;audio('chime');const n=c.crash;CR=null;['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].forEach(k=>keys[k]=false);
  if(n){S.rep-=Math.min(6,n*2);log(`🏗️ งานเครนสำเร็จ แต่ชน ${n} ครั้ง เสียงบซ่อม ${(n*.05).toFixed(2)} ล้าน`,'warn');}else{S.rep+=2;S.xp+=8;log('🏗️ บังคับเครนนุ่มนวล ไม่มีการกระแทก! ทีมปรบมือ 👏','ok');}
